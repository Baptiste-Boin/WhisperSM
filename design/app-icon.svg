<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C6BFF"/>
      <stop offset="55%" stop-color="#5B5BF3"/>
      <stop offset="100%" stop-color="#2E8BFF"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="0" y="0" width="1024" height="1024" rx="232" ry="232" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="512" rx="232" ry="232" fill="url(#shine)"/>
  <g fill="#ffffff" filter="url(#glow)">
    <rect x="196" y="452" width="72" height="120" rx="36"/>
    <rect x="316" y="356" width="72" height="312" rx="36"/>
    <rect x="436" y="248" width="72" height="528" rx="36"/>
    <rect x="556" y="316" width="72" height="392" rx="36"/>
    <rect x="676" y="404" width="72" height="216" rx="36"/>
    <rect x="796" y="470" width="72" height="84" rx="36"/>
  </g>
</svg>
