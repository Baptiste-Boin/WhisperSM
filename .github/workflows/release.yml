name: "Release"

# Builds signed installers for every platform and publishes a GitHub release
# with the updater manifest (latest.json) that running apps poll.
#
# Trigger it by pushing a tag that matches the version in
# src-tauri/tauri.conf.json (bun run release:bump patch && git push --follow-tags),
# or manually from the Actions tab.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the release once every build succeeds"
        required: false
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      apple_signing: ${{ steps.secrets.outputs.apple_signing }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(grep -o '"version": "[^"]*"' src-tauri/tauri.conf.json | cut -d'"' -f4)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            if [[ "$TAG" != "v$VERSION" ]]; then
              echo "::error::Tag $TAG does not match tauri.conf.json version v$VERSION"
              exit 1
            fi
          fi

      - name: Check signing secrets
        id: secrets
        shell: bash
        env:
          HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
        run: |
          if [[ "$HAS_UPDATER_KEY" != "true" ]]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set. Auto-update artifacts cannot be signed. See RELEASING.md."
            exit 1
          fi
          echo "apple_signing=$HAS_APPLE_CERT" >> "$GITHUB_OUTPUT"
          if [[ "$HAS_APPLE_CERT" == "true" ]]; then
            echo "Apple signing: enabled"
          else
            echo "::warning::APPLE_CERTIFICATE not set — macOS builds will be ad-hoc signed (Gatekeeper will warn on first launch)."
          fi

  create-release:
    name: Create draft release
    needs: preflight
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.create.outputs.result }}
    steps:
      - name: Create or reuse draft release
        id: create
        uses: actions/github-script@v7
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        with:
          script: |
            const tag = `v${process.env.VERSION}`;
            try {
              const { data } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
              core.info(`Reusing existing release ${data.id} for ${tag}`);
              return data.id;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `WhisperSM ${tag}`,
              draft: true,
              prerelease: false,
              generate_release_notes: true,
            });
            core.info(`Created draft release ${data.id} for ${tag}`);
            return data.id;

  build:
    name: Build
    needs: [preflight, create-release]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-26" # Apple Silicon (macOS 26 SDK for Apple Intelligence)
            args: "--target aarch64-apple-darwin"
            target: "aarch64-apple-darwin"
          - platform: "macos-latest" # Intel Macs (cross-compiled)
            args: "--target x86_64-apple-darwin"
            target: "x86_64-apple-darwin"
          - platform: "windows-latest"
            args: ""
            target: "x86_64-pc-windows-msvc"
          - platform: "ubuntu-22.04"
            args: "--bundles deb"
            target: "x86_64-unknown-linux-gnu"
          - platform: "ubuntu-24.04"
            args: "--bundles appimage,rpm"
            target: "x86_64-unknown-linux-gnu"
    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: ${{ matrix.args }}
      sign-binaries: true
      apple_signing: ${{ needs.preflight.outputs.apple_signing == 'true' }}
      asset-prefix: "whispersm"
      upload-artifacts: false
      release-id: ${{ needs.create-release.outputs.release-id }}
    secrets: inherit

  publish:
    name: Publish release
    needs: [preflight, create-release, build]
    if: ${{ github.event_name == 'push' || inputs.publish }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Verify updater manifest and publish
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release-id }}
          VERSION: ${{ needs.preflight.outputs.version }}
        with:
          script: |
            const release_id = Number(process.env.RELEASE_ID);
            const { data: assets } = await github.rest.repos.listReleaseAssets({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id,
              per_page: 100,
            });
            const names = assets.map((a) => a.name);
            core.info(`Assets: ${names.join(", ")}`);
            if (!names.includes("latest.json")) {
              core.setFailed("latest.json is missing from the release: the auto-updater would break. Not publishing.");
              return;
            }
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id,
              draft: false,
              make_latest: "true",
            });
            core.summary
              .addHeading(`WhisperSM v${process.env.VERSION} published`)
              .addList(names)
              .write();
